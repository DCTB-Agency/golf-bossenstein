<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a1d" />
  <title>Bossenstein 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f2a1d'/%3E%3Cpath d='M12 26V6l10 4-10 4' fill='%23e8c547' stroke='%23e8c547' stroke-width='1.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>Bossenstein</strong>
        <small>Championship · par 71</small>
      </div>
    </div>
    <div class="actions">
      <button id="btn-overview" title="Overzicht">Overzicht</button>
      <button id="btn-gps" title="Mijn locatie">📍 GPS</button>
      <button id="btn-edit" title="Holes intekenen">✎ Intekenen</button>
    </div>
  </header>

  <aside class="panel" id="hole-panel">
    <div class="hole-head">
      <button id="prev" aria-label="Vorige hole">‹</button>
      <div class="hole-title">
        <span>Hole</span>
        <strong id="hole-no">–</strong>
      </div>
      <button id="next" aria-label="Volgende hole">›</button>
    </div>
    <div class="stats">
      <div><small>Par</small><b id="hole-par">–</b></div>
      <div><small>SI</small><b id="hole-si">–</b></div>
      <div><small>Lengte</small><b id="hole-len">–</b></div>
      <div><small>Tot green</small><b id="hole-togo">–</b></div>
    </div>
    <label class="tee-pick">Tee
      <select id="tee-select"></select>
    </label>
    <section class="briefing" id="briefing"></section>
    <div class="editor" id="editor" hidden>
      <a id="drawing-link" target="_blank" rel="noopener"><img id="drawing" alt="Officiële hole-tekening" /></a>
      <p id="measure" class="measure">Nog niet ingetekend</p>
      <p>Klik op de knop en daarna op de kaart.</p>
      <div class="row">
        <button data-place="tee">Tee plaatsen</button>
        <button data-place="green">Green plaatsen</button>
        <button data-place="dogleg">+ Knikpunt</button>
      </div>
      <div class="row">
        <button id="clear-hole">Wis hole</button>
        <button id="export">Exporteer JSON</button>
      </div>
    </div>
  </aside>

  <nav class="holes" id="hole-strip"></nav>

  <!-- gsm: compacte onderbalk + briefing als sluitbare kaart -->
  <div class="mbar" id="mbar">
    <button id="m-prev" aria-label="Vorige hole">‹</button>
    <div class="m-info">
      <strong id="m-title">Hole –</strong>
      <span id="m-meta">–</span>
    </div>
    <button id="m-next" aria-label="Volgende hole">›</button>
    <button id="m-brief" class="cta">Briefing</button>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header>
        <div><strong id="sheet-title">Hole</strong><small id="sheet-sub"></small></div>
        <button id="sheet-close" aria-label="Sluiten">✕</button>
      </header>
      <div class="sheet-body briefing" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <footer class="attrib" id="attrib"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
